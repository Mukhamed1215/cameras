<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Камеры Алматы</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  .info { position: absolute; top: 10px; left: 50px; right: 10px; z-index: 1000;
          background: #fff; padding: 8px 12px; border-radius: 10px;
          box-shadow: 0 2px 8px rgba(0,0,0,.2); font-size: 14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 4px 0 10px; }
  .locate { position: absolute; right: 12px; bottom: 28px; z-index: 1000; width: 48px; height: 48px;
            border: none; border-radius: 50%; background: #fff; font-size: 22px; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .drive { position: absolute; right: 12px; bottom: 88px; z-index: 1000; height: 48px; padding: 0 16px;
           border: none; border-radius: 24px; background: #fff; font-size: 16px; font-weight: 600;
           cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .drive.on { background: #e53935; color: #fff; }
  .alert { position: absolute; left: 12px; right: 12px; top: 60px; z-index: 1001; display: none;
           background: #e53935; color: #fff; padding: 14px; border-radius: 12px; font-size: 18px;
           font-weight: 600; text-align: center; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .me { width: 16px; height: 16px; border-radius: 50%; background: #1e88e5;
         border: 3px solid #fff; box-shadow: 0 0 6px rgba(0,0,0,.4); box-sizing: border-box; }
  .toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 1000;
           background: rgba(0,0,0,.8); color: #fff; padding: 8px 14px; border-radius: 8px;
           font-size: 14px; display: none; max-width: 90%; text-align: center; }
</style>
</head>
<body>
<div class="info"><b>Камеры Алматы</b> · 5 камер ·
  <span class="dot" style="background:#e53935"></span>штраф за 30 дней
  <span class="dot" style="background:#9e9e9e"></span>давно</div>
<div id="map"></div>
<button class="locate" id="locate" title="Где я">📍</button>
<button class="drive" id="drive">🔊 Поездка</button>
<div class="alert" id="alert"></div>
<div class="toast" id="toast"></div>
<script>
const cams = [{"lat": 43.231101, "lon": 76.777303, "place": "г. Алматы, ЛУ 1222 р.Райымбека выезд с рынка Алтын Орда (западном нап)", "direction": "Запад, от ул. Алатау в сторону ул. Кунаева", "speed": "60", "violations": ["Скорость"], "count": 1, "last": "04.11.2026", "fresh": true}, {"lat": 43.241372, "lon": 76.820662, "place": "г. Алматы, ЛУ 1417 пр. Райымбека западнее ЖК \"Гулдер\" в восточном направлении", "direction": "Восток, от ул. Ашимова в сторону ул. Яссауи", "speed": "60", "violations": ["Скорость"], "count": 2, "last": "10.10.2026", "fresh": false}, {"lat": 43.228442, "lon": 76.812359, "place": "г. Алматы, ЛУ 1017 ул.Кунаева напротив ЛУ 319 в западном направлении", "direction": "Запад, от мкр. Калкаман-2 ул. 6 в сторону мкр. Калкаман-2 ул. 3", "speed": "", "violations": ["Телефон"], "count": 1, "last": "01.11.2026", "fresh": true}, {"lat": 43.264877, "lon": 76.938512, "place": "г. Алматы, ЛУ 1230 ул. Желтоксан 62/6 в северном направлении", "direction": "Север, от ул. Макатаева в сторону ул. Маметовой", "speed": "", "violations": ["Разметка / встречка"], "count": 1, "last": "09.11.2026", "fresh": true}, {"lat": 43.210869, "lon": 76.341271, "place": "Алматинская область, ЛУ 192 школа Олжа, медколледж пешеход", "direction": "Запад, от Село Каргалы в сторону с. Узынагаш, ул.Суюнбая", "speed": "40", "violations": ["Скорость"], "count": 1, "last": "09.11.2026", "fresh": true}];
const map = L.map('map').setView([43.238, 76.889], 12);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri'
}).addTo(map);
if (window.speechSynthesis) speechSynthesis.getVoices();  // подгружаем голоса заранее
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]);
cams.forEach(c => {
  let html = '<b>📷 ' + esc(c.place) + '</b>';
  if (c.direction) html += '<br>➡️ ' + esc(c.direction);
  if (c.violations.length) html += '<br>⚠️ Ловит: ' + esc(c.violations.join(', '));
  if (c.speed) html += '<br>🚦 Разрешено: ' + esc(c.speed) + ' км/ч';
  html += '<br>✅ Подтверждена штрафами: ' + c.count +
          '<br>🕒 Последний штраф: ' + esc(c.last);
  L.circleMarker([c.lat, c.lon], {
    radius: 8 + Math.min(c.count, 10), color: '#fff', weight: 2,
    fillColor: c.fresh ? '#e53935' : '#9e9e9e', fillOpacity: 0.9
  }).addTo(map).bindPopup(html);
});

// ---- местоположение того, кто смотрит карту (никуда не отправляется) ----
let me = null, meCircle = null, centered = false;
const toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = 'none', 4000);
};
function onPos(p) {
  const ll = [p.coords.latitude, p.coords.longitude];
  if (!me) {
    me = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16] }) })
          .addTo(map).bindPopup('Вы здесь');
    meCircle = L.circle(ll, { radius: p.coords.accuracy, color: '#1e88e5', weight: 1, fillOpacity: 0.1 }).addTo(map);
  } else {
    me.setLatLng(ll); meCircle.setLatLng(ll).setRadius(p.coords.accuracy);
  }
  if (!centered) { map.setView(ll, 15); centered = true; }
  if (driving) onDrivePos(p);
}

// ---- режим поездки: голосовое предупреждение о камерах впереди ----
const WARN_M = 300, RESET_M = 600, AHEAD_DEG = 50;
let driving = false, heading = null, lastLL = null, wakeLock = null;
const warned = new Set();
const rad = d => d * Math.PI / 180;
function dist(a, b) {
  const R = 6371000, dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(rad(b[1] - a[1])) * Math.cos(rad(b[0]));
  const x = Math.cos(rad(a[0])) * Math.sin(rad(b[0])) - Math.sin(rad(a[0])) * Math.cos(rad(b[0])) * Math.cos(rad(b[1] - a[1]));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
const angleDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
function phrase(c, m) {
  const v = c.violations || [];
  let s = 'Через ' + (Math.round(m / 50) * 50) + ' метров камера.';
  if (v.includes('Скорость') && c.speed) s += ' Ограничение ' + c.speed + '.';
  if (v.includes('Телефон')) s += ' Фиксирует телефон.';
  if (v.includes('Автобусная полоса')) s += ' Автобусная полоса.';
  if (v.includes('Ремень')) s += ' Ремень.';
  if (v.includes('Красный свет')) s += ' Красный свет.';
  if (v.includes('Стоп-линия')) s += ' Стоп-линия.';
  return s;
}
function say(text) {
  const a = document.getElementById('alert');
  a.textContent = '⚠️ ' + text; a.style.display = 'block';
  clearTimeout(say.timer); say.timer = setTimeout(() => a.style.display = 'none', 6000);
  if (window.speechSynthesis) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU';
    const ru = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ru'));
    if (ru) u.voice = ru;
    speechSynthesis.speak(u);
  }
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
}
function onDrivePos(p) {
  const ll = [p.coords.latitude, p.coords.longitude];
  // направление движения: из GPS, а если его нет — по последним двум точкам
  if (p.coords.heading != null && !isNaN(p.coords.heading) && (p.coords.speed || 0) > 2) heading = p.coords.heading;
  else if (lastLL && dist(lastLL, ll) > 15) heading = bearing(lastLL, ll);
  if (!lastLL || dist(lastLL, ll) > 15) lastLL = ll;
  map.panTo(ll);
  if (heading == null) return;
  let best = null;
  cams.forEach((c, i) => {
    const d = dist(ll, [c.lat, c.lon]);
    if (d > RESET_M) { warned.delete(i); return; }
    if (d > WARN_M || warned.has(i)) return;
    if (angleDiff(bearing(ll, [c.lat, c.lon]), heading) > AHEAD_DEG) return;  // камера не по ходу движения
    if (!best || d < best.d) best = { c, i, d };
  });
  if (best) { warned.add(best.i); say(phrase(best.c, best.d)); }
}
async function keepScreenOn() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (driving && document.visibilityState === 'visible') keepScreenOn();
});
document.getElementById('drive').onclick = () => {
  driving = !driving;
  const btn = document.getElementById('drive');
  btn.classList.toggle('on', driving);
  btn.textContent = driving ? '⏹ Стоп' : '🔊 Поездка';
  if (driving) {
    warned.clear(); heading = null; lastLL = null;
    say('Режим поездки включён. Предупрежу о камерах впереди.');  // заодно разблокирует звук на телефоне
    keepScreenOn();
    if (!me) { centered = false; startWatch(); }
    else map.setView(me.getLatLng(), 16);
  } else {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    toast('Режим поездки выключен');
  }
};
function onErr(e) {
  if (e.code === 1) toast('Доступ к геолокации запрещён — разреши его в настройках браузера');
  else toast('Не удалось определить местоположение');
}
function startWatch() {
  if (!navigator.geolocation) return toast('Браузер не поддерживает геолокацию');
  navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 10000 });
}
document.getElementById('locate').onclick = () => {
  if (me) map.setView(me.getLatLng(), 16);
  else { centered = false; startWatch(); }
};
startWatch();
</script>
</body>
</html>
